version: 2

models:
  - name: customer_orders
    description: "Aggregated order metrics per customer (table materialization)"
    columns:
      - name: customer_name
        description: "Customer name"
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: "Number of orders placed"
        data_tests:
          - is_positive
      - name: total_spent
        description: '{{ doc("amount_dollars") }}'
        data_tests:
          - is_positive

  - name: completed_orders
    description: "Only completed orders (view materialization, set in the model and overriding the marts/ directory default)"
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_tests:
          - unique
          - not_null

  - name: orders_incremental
    description: "Incrementally loaded orders. Only new/updated rows are processed on subsequent runs. Uses dbt_utils.generate_surrogate_key for a hashed order key."
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_tests:
          - unique
          - not_null
      - name: order_key
        description: "Surrogate key generated by dbt_utils.generate_surrogate_key"
        data_tests:
          - not_null
      - name: status
        description: '{{ doc("order_status") }}'
      - name: amount_dollars
        description: '{{ doc("amount_dollars") }}'
