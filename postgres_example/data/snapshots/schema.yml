version: 2

snapshots:
  - name: orders_snapshot
    description: >
      SCD Type 2 history of raw_orders. One row per version of each order:
      when an order's updated_at changes, the previous version is closed
      (dbt_valid_to is set) and a new current version is inserted.
      Current rows have dbt_valid_to = NULL. See docs/snapshots.md.
    columns:
      - name: order_id
        description: "Order identifier (the snapshot unique_key). Not unique here: one row per version."
        data_tests:
          - not_null
      - name: customer_name
        description: "Name of the customer"
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["pending", "completed", "returned"]
      - name: amount_cents
        description: "Order amount in cents"
      - name: created_at
        description: "When the order was created"
      - name: updated_at
        description: "When the order was last updated in the source. Drives change detection (strategy='timestamp')."
      - name: dbt_scd_id
        description: "Hash uniquely identifying this version of the row (generated by dbt)"
        data_tests:
          - unique
          - not_null
      - name: dbt_updated_at
        description: "The updated_at value of this version (generated by dbt)"
      - name: dbt_valid_from
        description: "When this version became current (generated by dbt)"
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: "When this version was superseded. NULL means this is the current version (generated by dbt)"
