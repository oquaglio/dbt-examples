services:
  minio:
    image: minio/minio:latest # ← this is all you need
    hostname: minio
    ports:
      - "9000:9000"
      - "9009:9001"
    environment:
      MINIO_ROOT_USER: myminioadmin
      MINIO_ROOT_PASSWORD: SuperSecureMinioPass2025!
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
    volumes:
      - minio-data:/data

  trino:
    image: trinodb/trino:458
    hostname: trino-coordinator
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  mc-config: # ← new named volume just for mc
