name: trino_tagging_demo
version: 1.0.0
config-version: 2

profile: trino_tagging_demo

model-paths: ["models"]
seed-paths: ["seeds"]

models:
  +materialized: table
  +schema: demo
  # This post-hook is the magic — it applies real Trino/Iceberg properties
  +post-hook: |
    {% if 'pii' in tags or 'sensitive' in tags %}
      {{ log("Applying PII tag to " ~ this, info=True) }}
      {% set sql %}
        ALTER TABLE {{ this }} SET PROPERTIES tags = MAP(ARRAY['pii'], ARRAY['true'])
      {% endset %}
      {{ run_query(sql) }}
    {% endif %}

on-run-end:
  - "{{ apply_column_properties() }}"
