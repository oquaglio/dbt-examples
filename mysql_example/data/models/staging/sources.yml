version: 2

sources:
  - name: raw
    description: "Raw data loaded via dbt seeds"
    schema: mysql_example
    tables:
      - name: raw_orders
        description: "Raw orders seeded from CSV"
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: order_id
            description: "Unique order identifier"
          - name: customer_name
            description: "Name of the customer"
          - name: status
            description: "Order status (pending, completed, returned)"
          - name: amount_cents
            description: "Order amount in cents"
          - name: created_at
            description: "When the order was created"
          - name: updated_at
            description: "When the order was last updated"
