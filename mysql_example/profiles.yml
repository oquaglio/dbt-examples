mysql_example:
  target: dev # default target to use for dbt commands; can be overridden with --target flag
  outputs: # You can specify multiple outputs for different environments (e.g. dev, prod)
    dev: # This is the name of the target; it can be anything you like
      type: mysql # Use 'mysql' for MySQL 8.x (your container version); use 'mysql5' for 5.x or 'mariadb' for MariaDB
      server: localhost
      port: 3306
      schema: dbt_example # This should be the name of the database you created in MySQL
      username: root
      password: mysecretpassword
      ssl_disabled: True # Optional but recommended to disable TLS if not configured

